name: Autonomous X AI Agent

on:
  schedule:
    # 10 razy na dobę (w godzinach 08:15 - 21:45 czasu polskiego / CEST):
    - cron: '15 6,7,9,10,12,13,15,16,18,19 * * *'
  workflow_dispatch: # Pozwala odpalić publikację ręcznie z poziomu GitHuba jednym przyciskiem!

permissions:
  contents: write

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Agent and Post Tweet
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.5-flash'
          POST_LANGUAGE: 'EN'
        run: |
          python agent.py --post-now

      - name: Save and Commit History
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history.json
          git diff-index --quiet HEAD || git commit -m "chore: update tweet history [skip ci]"
          git push
